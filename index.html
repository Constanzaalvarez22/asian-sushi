<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEAz2DKAOvHOZWCbrK1YEH-9rGHSRDTHY",
  authDomain: "asian-sushi-7095b.firebaseapp.com",
  projectId: "asian-sushi-7095b",
  storageBucket: "asian-sushi-7095b.firebasestorage.app",
  messagingSenderId: "863718936530",
  appId: "1:863718936530:web:c518f95d029d1245c2020b"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
qz.websocket.connect()
.then(() => {
  console.log("QZ conectado");
})
.catch(error => {
  console.error(error);
  alert("QZ Tray no conectado");
});

let pedido = [];

async function guardarPedidoFirebase(datos) {

  try {

    await addDoc(collection(db, "pedidos"), datos);

    alert("Pedido enviado al local");

  } catch(error) {

    console.error(error);

    alert("Error enviando pedido");
  }
}

window.agregarPedido = function(producto, precio){

  let observacion = document.getElementById("observacion").value;

  let item = producto;

  if(observacion.trim() !== ""){
    item += " | Obs: " + observacion;
  }

  pedido.push({
    nombre: item,
    precio: precio
  });

  renderizarPedido();

  actualizarTotal();

  document.getElementById("observacion").value = "";
}

window.eliminarProducto = function(index){

  pedido.splice(index, 1);

  renderizarPedido();

  actualizarTotal();
}

window.actualizarTotal = function(){

  let subtotal = 0;

  pedido.forEach(item => {
    subtotal += item.precio;
  });

  let direccionData =
    document.getElementById("direccion").value.split("|");

  let delivery = parseInt(direccionData[1]);

  let total = subtotal + delivery;

  document.getElementById("total").innerText =
    "Total: $" + total;
}

window.renderizarPedido = function(){

  let lista = document.getElementById("lista");

  lista.innerHTML = "";

  pedido.forEach((item, index) => {

    lista.innerHTML += `
      <li style="margin-bottom:10px;">
        ${item.nombre} - $${item.precio}

        <button
          onclick="eliminarProducto(${index})"
          style="
            background:red;
            margin-left:10px;
            padding:5px 10px;
            border:none;
            border-radius:5px;
            color:white;
          ">
          X
        </button>
      </li>
    `;
  });
}

window.agregarRollPersonalizado = function(){

  let roll = document.getElementById("rollPersonalizado").value;

  if(roll.trim() !== ""){

    agregarPedido("Roll: " + roll, 5490);

    document.getElementById("rollPersonalizado").value = "";
  }
}

window.agregarGohanPersonalizado = function(){

  let gohan = document.getElementById("gohanPersonalizado").value;

  if(gohan.trim() !== ""){

    agregarPedido("Gohan: " + gohan, 7990);

    document.getElementById("gohanPersonalizado").value = "";
  }
}

window.agregarSushiburgerPersonalizado = function(){

  let sushiburger =
    document.getElementById("SushiburgerPersonalizado").value;

  if(sushiburger.trim() !== ""){

    agregarPedido("Sushiburger: " + sushiburger, 8900);

    document.getElementById("SushiburgerPersonalizado").value = "";
  }
}

window.vaciarPedido = function(){

  pedido = [];

  document.getElementById("lista").innerHTML = "";

  actualizarTotal();
}

window.imprimirComanda = async function(){

  let cliente = document.getElementById("cliente").value;

  let telefono = document.getElementById("telefono").value;

  let direccionData =
    document.getElementById("direccion").value.split("|");

  let direccionTexto =
    document.getElementById("direccionTexto").value;

  let palitos =
    document.getElementById("Palitos").value;

  let salsas =
    document.getElementById("Salsas").value;

  let observacionGeneral =
    document.getElementById("observacion").value;

  let horaEntrega =
    document.getElementById("horaEntrega").value;

  let metodoPago =
    document.getElementById("metodoPago").value;

  let delivery = parseInt(direccionData[1]);

  let subtotal =
    pedido.reduce((sum, item) => sum + item.precio, 0);

  let total = subtotal + delivery;

  await guardarPedidoFirebase({
    cliente,
    telefono,
    direccionTexto,
    palitos,
    salsas,
    observacionGeneral,
    metodoPago,
    horaEntrega,
    total,
    pedido,
    fecha: Date.now()
  });

  let texto = `
ASIAN SUSHI

Cliente: ${cliente}
Teléfono: ${telefono}

Dirección:
${direccionTexto}

Palitos: ${palitos}
Salsas: ${salsas}

----------------------

PEDIDO

${pedido.map(item =>
item.nombre + " - $" + item.precio).join("\n")}

----------------------

OBSERVACIÓN:
${observacionGeneral}

----------------------

TOTAL: $${total}

Método pago:
${metodoPago}

Horario:
${horaEntrega}

----------------------
`;
try {

  const config = qz.configs.create("impresora CAJA");

  await qz.print(config, [texto]);

  alert("Impreso correctamente");

} catch(error){

  console.error(error);

  alert("Error imprimiendo");
}

}

window.probar = async function(){

  try {

    const impresoras = await qz.printers.find();

    alert(impresoras);

  } catch(error){

    console.error(error);

    alert("QZ no conectado");
  }
}

window.vaciarPedido = vaciarPedido;

const contenedorPedidos = document.createElement("div");

contenedorPedidos.innerHTML = `
  <h2>Pedidos en tiempo real</h2>
  <div id="pedidosTiempoReal"></div>
`;

document.body.appendChild(contenedorPedidos);

const pedidosDiv =
  document.getElementById("pedidosTiempoReal");

const q = query(
  collection(db, "pedidos"),
  orderBy("fecha", "desc")
);

onSnapshot(q, (snapshot) => {

  pedidosDiv.innerHTML = "";

  snapshot.forEach((doc) => {

    const data = doc.data();

    pedidosDiv.innerHTML += `
      <div style="
        background:white;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
      ">
        <b>${data.cliente}</b><br>
        ${data.telefono}<br>
        ${data.direccionTexto}<br>
        Total: $${data.total}
      </div>
    `;
  });
});
</script>
