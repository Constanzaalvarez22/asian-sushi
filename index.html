<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Asian Sushi - Comandas</title>

  <script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>

  <style>
    body{
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1{ color:#111; }
    h2{ margin-top:30px; }

    button{
      margin:5px;
      padding:10px 15px;
      cursor:pointer;
      border:none;
      border-radius:8px;
      background:black;
      color:white;
    }

    input, select{
      margin:5px;
      padding:10px;
      width:260px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    #lista{
      margin-top:20px;
      background:white;
      padding:15px;
      border-radius:10px;
    }

    #total{
      color:green;
      font-size:28px;
    }
  </style>
</head>

<body>

<h1>Asian Sushi - Comandas</h1>

<input id="cliente" placeholder="Nombre cliente">
<input id="telefono" placeholder="Teléfono">

<label>Hora entrega</label>
<input type="time" id="horaEntrega">

<label>Método pago</label>
<select id="metodoPago">
  <option>Efectivo</option>
  <option>Transferencia</option>
  <option>Tarjeta</option>
</select>

<input id="direccionTexto" placeholder="Dirección exacta">

<select id="direccion" onchange="calcularTotal()">
  <option value="Retiro|0">Retiro - $0</option>
  <option value="Ovalle|2500">Ovalle - $2.500</option>
  <option value="Extremo Norte|3000">Extremo Norte - $3.000</option>
  <option value="Extremo Sur|4000">Extremo Sur - $4.000</option>
</select>

<h2>Productos</h2>

<button onclick="agregarPedido('Tabla 20', 9990)">Tabla 20</button>
<button onclick="agregarPedido('Tabla 40', 18990)">Tabla 40</button>
<button onclick="agregarPedido('Ceviche Roll', 9990)">Ceviche Roll</button>
<button onclick="agregarPedido('Coca Cola', 2990)">Coca Cola</button>

<h2>Observación</h2>
<input id="observacion" placeholder="Observación">

<h2>Resumen</h2>
<ul id="lista"></ul>

<h2 id="total">Total: $0</h2>

<button onclick="imprimirComanda()">Imprimir</button>
<button onclick="vaciarPedido()">Vaciar</button>
<button onclick="probar()">Probar impresora</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDEAz2DKAOvHOZWCbrK1YEH-9rGHSRDTHY",
  authDomain: "asian-sushi-7095b.firebaseapp.com",
  projectId: "asian-sushi-7095b",
  storageBucket: "asian-sushi-7095b.firebasestorage.app",
  messagingSenderId: "863718936530",
  appId: "1:863718936530:web:c518f95d029d1245c2020b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* VARIABLES */
let pedido = [];
const impresos = new Set();

/* QZ CONNECT */
window.addEventListener("load", async () => {
  try {
    if (!window.qz) return;

    qz.security.setCertificatePromise(res => res());
    qz.security.setSignaturePromise(toSign => res => res());

    await qz.websocket.connect();
    console.log("QZ conectado");
  } catch (e) {
    console.log("QZ error", e);
  }
});

/* AGREGAR */
window.agregarPedido = function (producto, precio) {

  const obs = document.getElementById("observacion").value;
  let item = producto;

  if (obs.trim()) item += " | " + obs;

  pedido.push({ nombre: item, precio });

  render();
  calcularTotal();

  document.getElementById("observacion").value = "";
};

/* RENDER */
function render() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  pedido.forEach((p, i) => {
    lista.innerHTML += `
      <li>
        ${p.nombre} - $${p.precio}
        <button onclick="eliminar(${i})">X</button>
      </li>`;
  });
}

/* ELIMINAR */
window.eliminar = function (i) {
  pedido.splice(i, 1);
  render();
  calcularTotal();
};

/* TOTAL */
function calcularTotal() {

  const subtotal = pedido.reduce((a,b)=>a+b.precio,0);
  const d = document.getElementById("direccion").value.split("|");
  const delivery = parseInt(d[1] || 0);

  document.getElementById("total").innerText =
    "Total: $" + (subtotal + delivery);
}

/* VACÍO */
window.vaciarPedido = function () {
  pedido = [];
  render();
  calcularTotal();
};

/* FIREBASE SAVE */
async function guardar(data){
  await addDoc(collection(db,"pedidos"),data);
}

/* IMPRIMIR */
window.imprimirComanda = async function () {

  const cliente = cliente.value;
  const telefono = telefono.value;
  const direccionTexto = document.getElementById("direccionTexto").value;
  const metodoPago = document.getElementById("metodoPago").value;
  const horaEntrega = document.getElementById("horaEntrega").value;

  const subtotal = pedido.reduce((a,b)=>a+b.precio,0);
  const d = document.getElementById("direccion").value.split("|");
  const delivery = parseInt(d[1] || 0);

  const total = subtotal + delivery;

  const data = {
    cliente,
    telefono,
    direccionTexto,
    metodoPago,
    horaEntrega,
    pedido,
    total,
    fecha: Date.now()
  };

  await guardar(data);

  const texto = `
ASIAN SUSHI

CLIENTE: ${cliente}
TEL: ${telefono}

PEDIDO:
${pedido.map(p=>p.nombre+" - $"+p.precio).join("\n")}

TOTAL: $${total}
`;

  try {
    const config = qz.configs.create("DASIANSUSHI-001");
    await qz.print(config,[texto]);
    alert("Impreso OK");
  } catch(e){
    console.log(e);
    alert("Error impresión");
  }
};

/* PRUEBA */
window.probar = async function(){
  try{
    const config = qz.configs.create("DASIANSUSHI-001");
    await qz.print(config,["PRUEBA OK"]);
  }catch(e){
    alert("No imprime");
    console.log(e);
  }
};

/* TIEMPO REAL */
const q = query(collection(db,"pedidos"),orderBy("fecha","desc"));

onSnapshot(q,(snap)=>{

  let div = document.getElementById("live");

  if(!div){
    div = document.createElement("div");
    div.id="live";
    document.body.appendChild(div);
  }

  div.innerHTML="";

  snap.forEach(doc=>{
    const d = doc.data();

    div.innerHTML += `
      <div style="background:white;padding:10px;margin:10px">
        <b>${d.cliente}</b><br>
        Total: $${d.total}
      </div>`;
  });

  snap.docChanges().forEach(ch=>{
    if(ch.type==="added"){
      if(!impresos.has(ch.doc.id)){
        impresos.add(ch.doc.id);
        imprimirAutomatico(ch.doc.data());
      }
    }
  });
});

window.imprimirAutomatico = async function(data){

  const texto = `
ASIAN SUSHI

CLIENTE: ${data.cliente}

${data.pedido.map(p=>p.nombre+" - $"+p.precio).join("\n")}

TOTAL: $${data.total}
`;

  try{
    const config = qz.configs.create("DASIANSUSHI-001");
    await qz.print(config,[texto]);
  }catch(e){
    console.log(e);
  }
};

</script>

</body>
</html>
