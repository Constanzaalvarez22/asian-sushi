<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEAz2DKAOvHOZWCbrK1YEH-9rGHSRDTHY",
  authDomain: "asian-sushi-7095b.firebaseapp.com",
  projectId: "asian-sushi-7095b",
  storageBucket: "asian-sushi-7095b.firebasestorage.app",
  messagingSenderId: "863718936530",
  appId: "1:863718936530:web:c518f95d029d1245c2020b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pedido = [];
const impresos = new Set();

window.addEventListener("load", async () => {
  try {

    if (typeof qz === "undefined") {
      console.log("QZ no cargado");
      return;
    }

    qz.security.setCertificatePromise(function (resolve) {
      resolve();
    });

    qz.security.setSignaturePromise(function (toSign) {
      return function (resolve) {
        resolve();
      };
    });

    await qz.websocket.connect();

    console.log("QZ conectado");

  } catch (error) {
    console.log("Error QZ:", error);
  }
});

async function guardarPedidoFirebase(data) {
  try {
    await addDoc(collection(db, "pedidos"), data);
  } catch (e) {
    console.log("Firebase error:", e);
  }
}

window.imprimirAutomatico = async function (data) {

  const texto = `
ASIAN SUSHI

CLIENTE: ${data.cliente}
TEL: ${data.telefono}

DIRECCIÓN:
${data.direccionTexto}

----------------------

PEDIDO:
${data.pedido.map(p => p.nombre + " - $" + p.precio).join("\n")}

----------------------

TOTAL: $${data.total}
PAGO: ${data.metodoPago}
HORA: ${data.horaEntrega}

----------------------
`;

  try {

    if (!qz.websocket.isActive()) {
      await qz.websocket.connect();
    }

    const config = qz.configs.create("impresora CAJA");

    await qz.print(config, [texto]);

    console.log("IMPRESO OK");

  } catch (err) {
    console.log("ERROR IMPRESIÓN:", err);
  }
};

window.agregarPedido = function (producto, precio) {

  const obs = document.getElementById("observacion").value;
  let item = producto;

  if (obs.trim() !== "") {
    item += " | Obs: " + obs;
  }

  pedido.push({ nombre: item, precio });

  render();
  calcularTotal();

  document.getElementById("observacion").value = "";
};

function render() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  pedido.forEach((item, i) => {
    lista.innerHTML += `
      <li>
        ${item.nombre} - $${item.precio}
        <button onclick="eliminar(${i})">X</button>
      </li>
    `;
  });
}

window.eliminar = function (i) {
  pedido.splice(i, 1);
  render();
  calcularTotal();
};

function calcularTotal() {

  let subtotal = pedido.reduce((a, b) => a + b.precio, 0);

  let direccion = document.getElementById("direccion").value.split("|");
  let delivery = parseInt(direccion[1] || 0);

  document.getElementById("total").innerText =
    "Total: $" + (subtotal + delivery);
}

window.vaciarPedido = function () {
  pedido = [];
  render();
  calcularTotal();
};

window.imprimirComanda = async function () {

  const cliente = document.getElementById("cliente").value;
  const telefono = document.getElementById("telefono").value;
  const direccionTexto = document.getElementById("direccionTexto").value;
  const metodoPago = document.getElementById("metodoPago").value;
  const horaEntrega = document.getElementById("horaEntrega").value;

  let subtotal = pedido.reduce((a, b) => a + b.precio, 0);

  let direccion = document.getElementById("direccion").value.split("|");
  let delivery = parseInt(direccion[1] || 0);

  let totalFinal = subtotal + delivery;

  const data = {
    cliente,
    telefono,
    direccionTexto,
    metodoPago,
    horaEntrega,
    pedido,
    total: totalFinal,
    fecha: Date.now()
  };

  await guardarPedidoFirebase(data);

  const texto = `
ASIAN SUSHI

CLIENTE: ${cliente}
TEL: ${telefono}

PEDIDO:
${pedido.map(i => i.nombre + " - $" + i.precio).join("\n")}

TOTAL: $${totalFinal}
`;

  try {

    if (!qz.websocket.isActive()) {
      await qz.websocket.connect();
    }

    const config = qz.configs.create("impresora CAJA");

    await qz.print(config, [texto]);

    alert("Impreso OK");

  } catch (err) {
    console.log("ERROR:", err);
    alert("Error impresión");
  }
};

const q = query(collection(db, "pedidos"), orderBy("fecha", "desc"));

onSnapshot(q, (snapshot) => {

  let div = document.getElementById("pedidosTiempoReal");

  if (!div) {
    div = document.createElement("div");
    div.id = "pedidosTiempoReal";
    document.body.appendChild(div);
  }

  div.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    div.innerHTML += `
      <div style="background:white;padding:10px;margin:10px;">
        <b>${data.cliente}</b><br>
        ${data.telefono}<br>
        Total: $${data.total}
      </div>
    `;
  });

  snapshot.docChanges().forEach(change => {

    if (change.type === "added") {

      const id = change.doc.id;

      if (!impresos.has(id)) {
        impresos.add(id);
        imprimirAutomatico(change.doc.data());
      }
    }
  });
});

</script>
